<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bewerbungsformular</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            max-width: 600px;
            background-color: #f4f4f4;
        }
        form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }
        input, select, button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #28a745;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h2>Bewerbungsformular</h2>
    <p>Bitte fülle das folgende Formular aus und lade die erforderlichen Dokumente hoch.</p>

    <form id="uploadForm">
        <label for="first_name">Vorname</label>
        <input type="text" id="first_name" name="first_name" required maxlength="32" placeholder="Max" pattern="^[A-ZÄÖÜ][a-zäöüß]*$" title="Bitte gib deinen Vornamen mit einem Großbuchstaben an.">

        <label for="second_name">Nachname</label>
        <input type="text" id="second_name" name="second_name" required maxlength="32" placeholder="Mustermann" pattern="^[A-ZÄÖÜ][a-zäöüß]*$" title="Bitte gib deinen Nachnamen mit einem Großbuchstaben an.">

        <label for="birthday">Geburtsdatum</label>
        <input type="date" id="birthday" name="birthday" required>

        <label for="birthplace">Geburtsort</label>
        <input type="text" id="birthplace" name="birthplace" required maxlength="64" placeholder="Karlsruhe, Deutschland">

        <label for="EMail">E-Mail-Adresse</label>
        <input type="email" id="EMail" name="EMail" required placeholder="max.mustermann@example.com">

        <label for="nationality">Nationalität</label>
        <input type="text" id="nationality" name="nationality" required placeholder="Deutsch">

        <label for="phonenumber">Telefonnummer</label>
        <input type="tel" id="phonenumber" name="phonenumber" required placeholder="+49 123 4567890">

        <label for="current_adress">Aktuelle Adresse</label>
        <input type="text" id="current_adress" name="current_adress" required placeholder="Musterstraße 1, 76131 Karlsruhe">

        <label for="number_semesters_to_stay">Geplante Anzahl an Semestern</label>
        <input type="number" id="number_semesters_to_stay" name="number_semesters_to_stay" required min="1" max="10">

        <label for="university">Universität</label>
        <select id="university" name="university" required>
            <option value="">-- Wähle eine Universität --</option>
            <option>Karlsruher Institut für Technologie</option>
            <option>HKA</option>
            <option>Pädagogische Hochschule Karlsruhe</option>
        </select>

        <label for="subject">Studienfach</label>
        <select id="subject" name="subject" required>
            <option value="">-- Wähle ein Fach --</option>
            <option>Mathematik</option>
            <option>Informatik</option>
            <option>Maschinenbau</option>
            <option>Elektrotechnik</option>
        </select>

        <label for="why_to_move_in">Warum möchtest du einziehen?</label>
        <textarea id="why_to_move_in" name="why_to_move_in" rows="3" placeholder="Beschreibe deine Motivation" required></textarea>

        <label for="motivation">Motivation</label>
        <textarea id="motivation" name="motivation" rows="3" placeholder="Erkläre deine akademischen und persönlichen Ziele" required></textarea>

        <label for="immatrikulation_paper">Immatrikulationsbescheinigung</label>
        <input type="file" id="immatrikulation_paper" name="immatrikulation_paper" required>

        <label for="photo">Foto</label>
        <input type="file" id="photo" name="photo" required>

        <label for="CV">Lebenslauf (PDF)</label>
        <input type="file" id="CV" name="CV" required accept=".pdf">

        <button type="submit">Hochladen</button>
    </form>

</body>
</html>


<script>
    document.getElementById("uploadForm").addEventListener("submit", async function(event) {
        event.preventDefault();
    
        let formData = new FormData(this);
    
        let response = await fetch("https://script.google.com/macros/s/AKfycby9UtzHbpSflGDbTOcANfVI8IIUnSfCMQ82t_HRhZf1-f_LsUR0_ClKnm0AAEcXdP-Q/exec", {
            method: "POST",
            body: formData
        });
    
        let result = await response.json();
        if (result.status === "success") {
            alert("Hochladen erfolgreich!");
        } else {
            alert("Fehler: " + result.message);
        }
    });
    </script>
